server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service Worker do PWA: NUNCA deve ficar em cache no navegador — senão o
    # app fica preso numa versão antiga do sw.js mesmo depois de um deploy
    # novo (o browser só busca uma versão atualizada do service worker
    # quando o próprio arquivo sw.js muda de conteúdo, mas isso exige que
    # o navegador o busque de novo do servidor a cada visita).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Mesma lógica para o arquivo de configuração de runtime — precisa ser
    # sempre buscado fresco, já que é reescrito a cada início do container
    # (ver docker-entrypoint.d/40-oratorium-env.sh).
    location = /env-config.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota que não bata com um arquivo real
    # (ex: /dia/2026-08-16) deve servir o index.html, deixando o
    # react-router-dom decidir o que renderizar no lado do cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
