# docker-compose.yml — orquestração do backend da Abbatia (Scriptorium)
# para rodar no CasaOS (Debian 13) da homelab.
#
# Este arquivo fica na RAIZ do monorepo (ao lado das pastas Scriptorium/ e
# Oratorium/) de propósito: é o ponto de entrada único para subir todo o
# ecossistema — hoje só o backend, mas no futuro o Oratorium (frontend)
# ganhará seu próprio serviço aqui também, no mesmo arquivo.
#
# COMO USAR:
#   1) Ajuste o IP do LM Studio na âncora `x-lm-studio-url` logo abaixo.
#   2) Ajuste ORATORIUM_API_BASE_URL (no serviço "oratorium") para o IP LAN
#      real do seu CasaOS — é o endereço que o NAVEGADOR do usuário final
#      vai usar para falar com a API, então precisa ser alcançável de fora
#      do Docker (não pode ser "scriptorium-api", nome só resolvível dentro
#      da rede interna do Compose).
#   3) Faça o BUILD de cada serviço SEPARADAMENTE (um comando por vez, não
#      "docker compose up -d --build"). Isso evita que o `dotnet build` da
#      API, o `dotnet build` do Worker e o `npm run build` do Oratorium
#      rodem TODOS AO MESMO TEMPO disputando CPU/RAM do servidor — o
#      Compose, por padrão, builda todos os serviços em paralelo quando
#      recebe um único comando com --build:
#        docker compose build scriptorium-api
#        docker compose build scriptorium-worker
#        docker compose build oratorium
#   4) Depois que as 3 imagens estiverem construídas, suba os containers:
#        docker compose up -d
#      (sem --build aqui — as imagens já existem; ver `depends_on` de cada
#      serviço abaixo para o escalonamento também na hora de LIGAR os
#      containers, não só no build)
#   5) A API (Swagger/teste manual) fica em http://<ip-do-casaos>:8110/
#      O APP do devocional (o que o usuário final vê) fica em
#      http://<ip-do-casaos>:8111/ — são DOIS containers/portas diferentes;
#      acessar a porta 8110 SEMPRE mostra o Swagger (é a API), nunca o
#      front. Se 8111 não abrir, veja "SOLUÇÃO DE PROBLEMAS" mais abaixo.
#
# SOLUÇÃO DE PROBLEMAS — "só vejo o Swagger, cadê o front?"
# -----------------------------------------------------------------------
# O Swagger (porta 8110) e o Oratorium (porta 8111) são dois containers
# INDEPENDENTES. Se você só enxerga o Swagger, o container `oratorium`
# provavelmente não chegou a ser criado/iniciado. Causas mais comuns:
#   a) O servidor ainda está com uma cópia antiga deste arquivo (de antes
#      do serviço "oratorium" existir). Rode `git pull` na pasta do
#      projeto no servidor e confirme com `grep oratorium docker-compose.yml`
#      que o serviço aparece antes de tentar subir de novo.
#   b) O build/start do oratorium falhou silenciosamente. Rode
#      `docker compose ps` (deve listar abbatia-oratorium) e, se não
#      aparecer ou estiver "unhealthy"/reiniciando, veja o motivo com
#      `docker compose logs oratorium`.
#   c) Se você usa o painel de apps do CasaOS (em vez da linha de comando)
#      para gerenciar isto, reimporte/atualize o compose file por lá —
#      o painel pode ter ficado com a definição antiga em cache.
#
# Definimos TRÊS SERVIÇOS:
#   - scriptorium-api:    processo Kestrel, responde requisições HTTP (leitura rápida do SQLite)
#   - scriptorium-worker: processo em background, faz o scraping/tradução de madrugada e ESCREVE no SQLite
#   - oratorium:          frontend React/PWA, servido por nginx, consumido pelo navegador do usuário
# Os dois primeiros compartilham o MESMO Dockerfile (Scriptorium/Dockerfile),
# cada um apontando para um `target` de build diferente (ver comentários
# dentro do Dockerfile sobre multi-stage build); o Oratorium tem seu próprio
# Dockerfile em Oratorium/Dockerfile.
#
# ÂNCORA YAML — FONTE ÚNICA DA VERDADE PARA A URL DO LM STUDIO
# ------------------------------------------------------------
# Na primeira versão deste arquivo, a URL do LM Studio era declarada
# SEPARADAMENTE em cada serviço (`${LM_STUDIO_BASE_URL:-...}` repetido duas
# vezes). Isso causou um bug real: ao editar o valor em um dos serviços (via
# CasaOS ou manualmente), o OUTRO serviço continuava com o valor antigo,
# porque eram duas strings independentes sem nenhuma ligação entre si — o
# YAML não tinha como saber que deveriam ser sempre iguais.
#
# A correção usa uma ÂNCORA YAML (`&lm-studio-url`), um recurso NATIVO do
# formato YAML (não é coisa do Docker) que permite declarar um valor UMA
# ÚNICA VEZ e reutilizá-lo em múltiplos lugares via uma REFERÊNCIA
# (`*lm-studio-url`). Assim, existe uma ÚNICA linha no arquivo inteiro que
# você precisa editar para trocar o IP do LM Studio — os dois serviços
# sempre ficam sincronizados automaticamente, porque tecnicamente são o
# MESMO valor, não duas cópias.
#
# IMPORTANTE se você usa a interface do CasaOS para editar variáveis de
# ambiente: painéis de "Environment Variables" de gerenciadores de container
# costumam reescrever o arquivo e "achatar" (expandir) âncoras YAML em
# valores literais duplicados — o que reintroduziria o mesmo bug. Para
# EDITAR O IP DO LM STUDIO COM SEGURANÇA, prefira sempre editar o arquivo
# docker-compose.yml diretamente (pela aba de "Compose File"/edição de
# arquivo do CasaOS, ou por SSH) em vez do formulário de variáveis
# individuais por container.
#
# O `${LM_STUDIO_BASE_URL:-...}` continua funcionando como antes para quem
# preferir sobrescrever via variável de ambiente do shell/arquivo .env na
# hora de rodar `docker compose up` — só que agora só existe UMA ocorrência
# dele no arquivo inteiro.
x-lm-studio-url: &lm-studio-url "${LM_STUDIO_BASE_URL:-http://192.168.0.2:1234}"

services:
  scriptorium-api:
    build:
      # O "context" é a pasta Scriptorium/ (onde vive a Scriptorium.sln e
      # todo o código-fonte) — é a partir dali que o Dockerfile enxerga os
      # caminhos relativos usados nos comandos COPY.
      context: ./Scriptorium
      dockerfile: Dockerfile
      target: api-final
    image: abbatia/scriptorium-api:latest
    container_name: abbatia-scriptorium-api
    restart: unless-stopped
    ports:
      # Porta externa (host):porta interna (container, definida no Dockerfile via ASPNETCORE_URLS).
      # Ajuste a porta externa aqui se 8080 já estiver em uso no seu CasaOS.
      - "8110:8080"
    environment:
      # Connection string do SQLite: aponta para dentro do VOLUME nomeado
      # "scriptorium-data" (declarado no final deste arquivo), montado em
      # /data dentro do container — assim o arquivo .db sobrevive a
      # reinicializações e atualizações do container.
      ConnectionStrings__Default: "Data Source=/data/scriptorium.db"

      # Referencia a âncora `x-lm-studio-url` definida no topo do arquivo —
      # ver o comentário grande logo acima de `services:` para entender por
      # que isso substituiu a declaração duplicada anterior.
      LmStudio__BaseUrl: *lm-studio-url
    volumes:
      - scriptorium-data:/data
    # ------------------------------------------------------------------
    # LIMITE DE MEMÓRIA (e CPU) — sem isso, um container .NET pode, em
    # teoria, consumir toda a RAM disponível no host se algo der muito
    # errado (ex: um vazamento de memória, um loop de retry sem limite).
    # Isso é especialmente importante numa homelab onde o mesmo servidor
    # roda VÁRIOS outros apps do CasaOS ao mesmo tempo — um container sem
    # limite pode "sufocar" os demais.
    #
    # Por que 256MB é um valor aceitável aqui: a API é um processo ASP.NET
    # Core minimalista, cuja única tarefa é ler linhas do SQLite e devolver
    # JSON — não faz scraping nem carrega páginas HTML inteiras em memória.
    # Na prática, uma API assim roda folgada com 80-120MB; 256MB dá uma
    # margem de segurança generosa sem desperdiçar RAM do host.
    #
    # NOTA TÉCNICA (.NET + containers): o Garbage Collector do .NET, desde o
    # .NET Core 3.0, é "cgroup-aware" — ele detecta automaticamente o limite
    # de memória do container (via cgroups do Linux, o mecanismo por trás do
    # `mem_limit` do Docker) e dimensiona o heap gerenciado de acordo, sem
    # precisar de nenhuma configuração adicional. Ou seja: basta definir o
    # limite aqui embaixo que o runtime .NET já se comporta corretamente
    # dentro dele.
    #
    # Definimos o limite em DOIS FORMATOS por compatibilidade: `deploy.resources`
    # é o formato moderno da Compose Specification (funciona com
    # `docker compose up` mesmo fora do modo Swarm nas versões atuais do
    # Docker Compose); `mem_limit`/`mem_reservation` são o formato legado que
    # ferramentas de gerenciamento gráficas como o CasaOS costumam ler/exibir
    # nos seus próprios painéis de "limite de recursos". Ter os dois garante
    # que o limite seja respeitado independentemente de qual caminho (CLI
    # pura ou UI do CasaOS) está efetivamente subindo o container.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      # Usa o endpoint GET /health (implementado em Scriptorium.API/Program.cs)
      # para o Docker saber se o container está realmente pronto para
      # receber tráfego, reiniciando-o automaticamente se parar de responder.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scriptorium-worker:
    build:
      context: ./Scriptorium
      dockerfile: Dockerfile
      target: worker-final
    image: abbatia/scriptorium-worker:latest
    container_name: abbatia-scriptorium-worker
    restart: unless-stopped
    # ESCALONAMENTO DE INICIALIZAÇÃO: espera a API terminar de subir e
    # responder saudável (via seu healthcheck, `test: curl .../health`)
    # antes de iniciar o Worker. Sem isso, o Compose criaria os dois
    # containers .NET praticamente ao mesmo tempo — em um servidor modesto,
    # dois processos `dotnet` inicializando (JIT, carregar o runtime, etc)
    # ao mesmo tempo é mais pesado do que um de cada vez. Não é uma
    # dependência FUNCIONAL (o Worker aplicaria a própria migration do
    # banco mesmo se subisse primeiro — ver DailyDevotionalWorker.cs), é
    # puramente para não sobrecarregar o servidor no boot.
    depends_on:
      scriptorium-api:
        condition: service_healthy
    environment:
      # Mesmo arquivo SQLite da API, mesmo volume — o Worker ESCREVE aqui,
      # a API só LÊ (ver comentários em DailyDevotionalWorker.cs sobre essa
      # separação de responsabilidades).
      ConnectionStrings__Default: "Data Source=/data/scriptorium.db"
      LmStudio__BaseUrl: *lm-studio-url

      # Configuração do agendamento diário (ver WorkerScheduleOptions.cs).
      # HourUtc=6 equivale a ~03h da madrugada em Brasília (UTC-3).
      WorkerSchedule__HourUtc: "6"
      WorkerSchedule__DaysAhead: "7"
      # Em produção real, normalmente deixaríamos "false" para não disparar
      # uma raspagem completa toda vez que o container reinicia (ex: após
      # uma atualização) — mas "true" é conveniente para você VER o Worker
      # funcionando logo após o primeiro `docker compose up`, sem esperar
      # até a próxima madrugada. Ajuste para "false" quando o sistema já
      # estiver rodando estável na sua homelab.
      WorkerSchedule__RunImmediatelyOnStartup: "true"
    volumes:
      - scriptorium-data:/data
    # Mesma lógica do limite de memória da API (ver comentário detalhado
    # acima, no serviço scriptorium-api). O Worker também é leve — faz
    # requisições HTTP e faz o parsing de HTML com HtmlAgilityPack, que
    # segura no máximo algumas centenas de KB por vez (a maior página, o
    # calendário anual do gcatholic.org, tem ~170KB) — 256MB é confortável.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 128M
    mem_limit: 256m
    mem_reservation: 128m

  oratorium:
    build:
      context: ./Oratorium
      dockerfile: Dockerfile
    image: abbatia/oratorium:latest
    container_name: abbatia-oratorium
    restart: unless-stopped
    ports:
      - "8111:80"
    environment:
      # IMPORTANTE: diferente de LmStudio__BaseUrl (chamado de DENTRO de
      # outro container, na rede interna do Docker), este valor é
      # consumido pelo NAVEGADOR do usuário final, que roda fora de
      # qualquer rede Docker — por isso precisa ser um endereço
      # alcançável na sua LAN (o IP do CasaOS), nunca o nome interno do
      # serviço "scriptorium-api". Trocar este valor só exige reiniciar o
      # container (não uma reconstrução da imagem) — ver
      # Oratorium/docker-entrypoint.d/40-oratorium-env.sh.
      ORATORIUM_API_BASE_URL: "http://192.168.0.11:8110"
    # Espera o Worker ao menos TER SIDO INICIADO (`service_started`, não
    # `service_healthy` — o Worker não expõe HTTP, então não tem
    # healthcheck para aguardar) antes de subir o nginx do Oratorium. Essa
    # dependência também não é funcional (o Oratorium só fala com a API,
    # nunca com o Worker) — é o terceiro e último elo do escalonamento de
    # boot: api (saudável) -> worker (iniciado) -> oratorium, para não
    # ligar os 3 containers de uma vez só.
    depends_on:
      scriptorium-worker:
        condition: service_started
    # O Oratorium é só um servidor nginx entregando arquivos estáticos —
    # ainda mais leve que a API/Worker em .NET, por isso o limite é bem
    # menor (128MB é generoso; o nginx sozinho normalmente usa poucos MB).
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 32M
    mem_limit: 128m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Volume NOMEADO (gerenciado pelo próprio Docker, em vez de um bind mount
# para uma pasta específica do host) — mais portátil entre diferentes
# instalações do CasaOS, já que não depende de um caminho absoluto do
# sistema de arquivos do host existir de antemão. Se preferir ter acesso
# direto ao arquivo .db pelo File Manager do CasaOS, troque por um bind
# mount, ex: "/DATA/AppData/Abbatia/dados-sqlite:/data".
volumes:
  scriptorium-data:
    driver: local
